  line-height: 1;
  margin: 0;
}
.clock { font-family: 'Bebas Neue', sans-serif; color: var(--muted); font-size: 22px; letter-spacing: 0.05em; }
.subtitle { color: var(--muted); font-size: 13px; margin: 4px 0 0; }

.closing-banner {
  margin-top: 20px;
  display:flex; align-items:center; justify-content:space-between;
  border-radius: 16px; padding: 12px 16px;
  background: var(--panel); border: 1px solid var(--panel-border);
}
.closing-banner.danger { border-color: var(--red); box-shadow: 0 0 18px rgba(225,82,61,0.2); }
.closing-banner .left { display:flex; align-items:center; gap:8px; font-size:13px; }
.closing-banner .right { color: var(--muted); font-size: 11px; }

section { margin-top: 28px; }
.section-label { color: var(--muted); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; font-weight: 600; margin-bottom: 8px; }

.add-row { display:flex; gap: 8px; }
.add-row input {
  flex: 1; border-radius: 12px; padding: 13px 16px; outline: none;
  background: var(--panel); border: 1px solid var(--panel-border); color: var(--cream); font-size: 15px; font-family: inherit;
}
.add-row input::placeholder { color: var(--muted); }
.btn-amber {
  border-radius: 12px; padding: 0 18px; display:flex; align-items:center; gap:6px;
  background: var(--amber); color: #1B1305; font-weight: 700; border: none; font-size: 14px; cursor: pointer;
}

.card {
  display:flex; align-items:center; justify-content:space-between;
  border-radius: 14px; padding: 13px 16px; background: var(--panel); border: 1px solid var(--panel-border);
  margin-bottom: 8px;
}
.card .left { display:flex; align-items:center; gap:10px; }
.dot { width:8px; height:8px; border-radius:50%; background: var(--red); box-shadow: 0 0 8px var(--red); display:inline-block; }
.name { color: var(--cream); font-weight: 600; }
.time-live { color: var(--teal); font-size: 13px; font-variant-numeric: tabular-nums; }
.time-total { color: var(--cream); font-variant-numeric: tabular-nums; font-weight: 600; }
.icon-btn { background: none; border: none; cursor: pointer; color: var(--muted); font-size: 18px; padding: 4px; }

.rank-num { font-family: 'Bebas Neue', sans-serif; font-size: 20px; width: 24px; text-align:center; color: var(--muted); }
.rank-1 { border-color: rgba(242,169,59,0.35) !important; }
.rank-num.gold { color: #F2C14E; }
.rank-num.silver { color: #C9CDD3; }
.rank-num.bronze { color: #C88A4E; }
.small-link { background:none; border:none; color: var(--teal); font-size: 12px; cursor:pointer; padding:0; margin-right: 10px; }
.small-link.danger { color: var(--red); }

.edit-row, .delete-row { flex-wrap: wrap; gap: 8px; }
.edit-fields { display:flex; align-items:center; gap: 6px; }
.edit-input {
  width: 46px; text-align:center; border-radius: 8px; padding: 6px 4px;
  background: var(--bg); border: 1px solid var(--panel-border); color: var(--cream); font-size: 14px; font-family: inherit;
}
.edit-unit { color: var(--muted); font-size: 12px; }
.edit-actions { display:flex; align-items:center; gap: 10px; }
.delete-row { border-color: var(--red) !important; }
.delete-text { color: var(--cream); font-size: 13px; flex: 1; min-width: 140px; }

.empty { color: var(--muted); font-size: 13px; }

.winner-row { display:flex; align-items:center; justify-content:space-between; padding: 10px 16px; }
.winner-row .left { display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; }
.winner-row .right { color: var(--muted); font-size: 12px; }

.controls { margin-top: 20px; display:flex; flex-direction:column; gap: 8px; }
.btn-ghost {
  width:100%; border-radius: 12px; padding: 13px; font-size: 14px; font-weight: 500;
  background: var(--panel); border: 1px solid var(--panel-border); color: var(--cream); cursor:pointer; font-family: inherit;
}
.btn-danger-outline {
  width:100%; border-radius: 12px; padding: 13px; font-size: 14px; font-weight: 600;
  background: transparent; border: 1px solid var(--red); color: var(--red); cursor:pointer; font-family: inherit;
}
.btn-danger-outline:disabled { opacity: 0.4; cursor: default; }

.confirm-box { border-radius: 14px; padding: 16px; background: var(--panel); border: 1px solid var(--red); }
.confirm-box p { margin: 0 0 12px; font-size: 13px; color: var(--cream); display:flex; gap:8px; align-items:flex-start; }
.confirm-actions { display:flex; gap: 8px; }
.btn-confirm { flex:1; border-radius: 10px; padding: 10px; font-weight: 700; background: var(--red); color: var(--cream); border:none; cursor:pointer; font-family:inherit; }
.btn-cancel { flex:1; border-radius: 10px; padding: 10px; background: transparent; border: 1px solid var(--panel-border); color: var(--muted); cursor:pointer; font-family:inherit; }

.save-note { color: var(--muted); font-size: 11px; text-align:center; margin-top: 4px; }
.save-note.err { color: var(--red); }

.closed-note { color: var(--muted); font-size: 13px; text-align:center; padding: 14px; background: var(--panel); border: 1px dashed var(--panel-border); border-radius: 12px; }

.admin-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.65);
  display:flex; align-items:center; justify-content:center; z-index: 999; padding: 20px;
}
.admin-modal { background: var(--panel); border: 1px solid var(--panel-border); border-radius: 16px; padding: 24px; width: 100%; max-width: 260px; text-align:center; }
.admin-title { font-family: 'Bebas Neue', sans-serif; font-size: 20px; letter-spacing: 0.04em; color: var(--cream); margin: 0 0 14px; }
.admin-input {
  width: 100%; text-align:center; font-size: 22px; letter-spacing: 8px; padding: 12px; border-radius: 10px;
  background: var(--bg); border: 1px solid var(--panel-border); color: var(--cream); font-family: inherit;
}
.admin-error { color: var(--red); font-size: 12px; min-height: 16px; margin-top: 8px; }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="title-row">
      <div class="brand">
        <span style="font-size:20px;">🔥</span>
        <h1>LE SOUND</h1>
      </div>
      <div class="clock" id="clockNow">--:--</div>
    </div>
    <p class="subtitle">Le challenge — qui tient le plus longtemps, cumulé soirée après soirée.</p>

    <div class="closing-banner" id="closingBanner">
      <div class="left">
        <span id="closingIcon">⏱</span>
        <span id="closingText">Fermeture à 2h</span>
      </div>
      <span class="right">auto-clôture 02:00</span>
    </div>
  </header>

  <main>
    <section>
      <div id="addZone">
        <div class="add-row" id="addRow">
          <input id="nameInput" placeholder="Prénom du client" maxlength="30">
          <button class="btn-amber" id="addBtn">+ Lancer</button>
        </div>
        <div class="closed-note" id="closedNote" style="display:none;">Le challenge est fermé — ouverture à 18h</div>
      </div>
    </section>

    <section id="activeSection" style="display:none;">
      <div class="section-label">En jeu maintenant</div>
      <div id="activeList"></div>
    </section>

    <section>
      <div class="section-label">Classement cumulé</div>
      <div id="leaderboard"></div>
    </section>

    <section id="winnersSection" style="display:none;">
      <div class="section-label">Anciens vainqueurs</div>
      <div id="winnersList"></div>
    </section>

    <section class="controls">
      <button class="btn-ghost" id="closeNightBtn">Clôturer la soirée maintenant (arrêter tous les chronos en cours)</button>
      <button class="btn-danger-outline" id="endChallengeBtn">Terminer le challenge &amp; désigner le vainqueur</button>
      <div id="confirmZone"></div>
      <div class="save-note" id="saveNote"></div>
    </section>
  </main>
</div>

<div id="adminOverlay" class="admin-overlay" style="display:none;">
  <div class="admin-modal">
    <p class="admin-title">Code administrateur</p>
    <input id="adminCodeInput" type="password" inputmode="numeric" maxlength="12" class="admin-input" placeholder="••••">
    <div id="adminError" class="admin-error"></div>
    <div class="edit-actions" style="justify-content:center;margin-top:10px;">
      <button class="btn-confirm" style="flex:none;padding:10px 24px;" onclick="submitAdminCode()">Valider</button>
      <button class="btn-cancel" style="flex:none;padding:10px 24px;" onclick="closeAdminModal()">Annuler</button>
    </div>
  </div>
</div>

<script>
const STORAGE_KEY = "leSoundChallengeData";

function loadData() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (!raw) return { clients: [], winners: [], lastAutoCloseDate: null };
    const parsed = JSON.parse(raw);
    return {
      clients: parsed.clients || [],
      winners: parsed.winners || [],
      lastAutoCloseDate: parsed.lastAutoCloseDate || null,
    };
  } catch (e) {
    return { clients: [], winners: [], lastAutoCloseDate: null };
  }
}

let state = loadData();
let confirmingEnd = false;

function saveData() {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    document.getElementById('saveNote').textContent = '';
    document.getElementById('saveNote').classList.remove('err');
  } catch (e) {
    document.getElementById('saveNote').textContent = "La sauvegarde a échoué — espace de stockage local plein ou navigation privée.";
    document.getElementById('saveNote').classList.add('err');
  }
}

function fmtDuration(totalSeconds) {
  const s = Math.max(0, Math.floor(totalSeconds));
  const h = Math.floor(s / 3600);
  const m = Math.floor((s % 3600) / 60);
  if (h === 0) return m + "min";
  return h + "h" + String(m).padStart(2, "0");
}

// Raw total from sessions + live timer, WITHOUT the manual adjustment
function clientRawSeconds(client, nowMs) {
  let total = client.sessions.reduce((acc, s) => acc + (s.end - s.start) / 1000, 0);
  if (client.active && client.currentStart) {
    total += (nowMs - client.currentStart) / 1000;
  }
  return total;
}

function clientTotalSeconds(client, nowMs) {
  return clientRawSeconds(client, nowMs) + (client.adjustment || 0);
}

function mostRecentClosing(now) {
  const c = new Date(now);
  c.setHours(2, 0, 0, 0);
  if (now.getHours() < 2) c.setDate(c.getDate() - 1);
  return c;
}

function closingInfo(now) {
  const closing = new Date(now);
  closing.setHours(2, 0, 0, 0);
  if (now.getHours() >= 2) closing.setDate(closing.getDate() + 1);
  const msLeft = closing - now;
  return Math.floor(msLeft / 60000);
}

function isOpenNow(now) {
  const h = now.getHours();
  return h >= 18 || h < 2; // ouvert de 18h00 à 01h59
}

// Single source of truth for closing: cuts any chrono still running past
// the last 02:00, whether the app was open continuously or not. Called on
// launch, every second, and whenever the tab regains focus/visibility —
// so a phone locking/sleeping through 2h can't leave a chrono stuck open.
function enforceClosing() {
  const threshold = mostRecentClosing(new Date()).getTime();
  let changed = false;
  state.clients = state.clients.map(c => {
    if (c.active && c.currentStart && c.currentStart < threshold) {
      changed = true;
      return {
        ...c,
        active: false,
        currentStart: null,
        sessions: [...c.sessions, { start: c.currentStart, end: threshold }],
      };
    }
    return c;
  });
  if (changed) {
    state.lastAutoCloseDate = new Date(threshold).toDateString();
    saveData();
  }
  return changed;
}

function addClient() {
  if (!isOpenNow(new Date())) return; // sécurité, le bouton est déjà masqué hors horaires
  const input = document.getElementById('nameInput');
  const trimmed = input.value.trim();
  if (!trimmed) return;
  state.clients.push({
    id: Date.now() + "-" + Math.random().toString(36).slice(2,7),
    name: trimmed,
    active: true,
    currentStart: Date.now(),
    sessions: [],
  });
  input.value = "";
  saveData();
  render();
}

function punchOut(id) {
  const nowMs = Date.now();
  state.clients = state.clients.map(c =>
    c.id === id && c.active
      ? { ...c, active: false, currentStart: null, sessions: [...c.sessions, { start: c.currentStart, end: nowMs }] }
      : c
  );
  saveData();
  render();
}

function punchIn(id) {
  if (!isOpenNow(new Date())) return; // sécurité, le bouton est déjà masqué hors horaires
  state.clients = state.clients.map(c => c.id === id && !c.active ? { ...c, active: true, currentStart: Date.now() } : c);
  saveData();
  render();
}

let editingId = null;
let deletingId = null;

function askDelete(id) {
  deletingId = id;
  editingId = null;
  render();
}

// ---- Code administrateur ----
// Protège : modifier un temps, supprimer un client, clôturer la soirée,
// désigner le vainqueur. Le pointage (lancer/arrêter son propre chrono)
// reste libre pour que les clients puissent se gérer eux-mêmes.
const ADMIN_CODE = "1806"; // <-- change ce code (garde-le uniquement pour toi)
let adminUnlocked = false;
let pendingAdminAction = null;

function requireAdmin(action) {
  if (adminUnlocked) { action(); return; }
  pendingAdminAction = action;
  document.getElementById('adminError').textContent = '';
  document.getElementById('adminCodeInput').value = '';
  document.getElementById('adminOverlay').style.display = 'flex';
  setTimeout(() => document.getElementById('adminCodeInput').focus(), 50);
}

function closeAdminModal() {
  document.getElementById('adminOverlay').style.display = 'none';
  pendingAdminAction = null;
}

function submitAdminCode() {
  const val = document.getElementById('adminCodeInput').value;
  if (val === ADMIN_CODE) {
    adminUnlocked = true;
    document.getElementById('adminOverlay').style.display = 'none';
    const action = pendingAdminAction;
    pendingAdminAction = null;
    if (action) action();
  } else {
    document.getElementById('adminError').textContent = 'Code incorrect';
    document.getElementById('adminCodeInput').value = '';
    document.getElementById('adminCodeInput').focus();
  }
}

function cancelDelete() {
  deletingId = null;
  render();
}

function confirmDelete(id) {
  removeClient(id);
  deletingId = null;
}

function startEdit(id) {
  editingId = id;
  deletingId = null;
  render();
  setTimeout(() => {
    const el = document.getElementById('editH-' + id);
    if (el) el.focus();
  }, 0);
}

function cancelEdit() {
  editingId = null;
  render();
}

function saveEdit(id) {
  const hEl = document.getElementById('editH-' + id);
  const mEl = document.getElementById('editM-' + id);
  const h = Math.max(0, parseInt(hEl.value, 10) || 0);
  const m = Math.max(0, Math.min(59, parseInt(mEl.value, 10) || 0));
  const desiredSeconds = h * 3600 + m * 60;

  const nowMs = Date.now();
  state.clients = state.clients.map(c => {
    if (c.id !== id) return c;
    const raw = clientRawSeconds(c, nowMs);
    return { ...c, adjustment: desiredSeconds - raw };
  });
  editingId = null;
  saveData();
  render();
}

function removeClient(id) {
  state.clients = state.clients.filter(c => c.id !== id);
  deletingId = null;
  saveData();
  render();
}

function closeNightNow() {
  const nowMs = Date.now();
  state.clients = state.clients.map(c =>
    c.active ? { ...c, active: false, currentStart: null, sessions: [...c.sessions, { start: c.currentStart, end: nowMs }] } : c
  );
  saveData();
  render();
}

function getRanked(nowMs) {
  return [...state.clients].sort((a,b) => clientTotalSeconds(b, nowMs) - clientTotalSeconds(a, nowMs));
}

function declareWinner() {
  const nowMs = Date.now();
  const ranked = getRanked(nowMs);
  if (ranked.length === 0) return;
  const champion = ranked[0];
  const total = clientTotalSeconds(champion, nowMs);
  state.winners.unshift({
    name: champion.name,
    total,
    date: new Date().toLocaleDateString("fr-FR", { day: "numeric", month: "long", year: "numeric" }),
  });
  state.clients = [];
  confirmingEnd = false;
  saveData();
  render();
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

function updateClosingBanner(now, openNow) {
  document.getElementById('clockNow').textContent = now.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });

  const banner = document.getElementById('closingBanner');
  if (openNow) {
    const minutesLeft = closingInfo(now);
    const danger = minutesLeft <= 30;
    banner.classList.toggle('danger', danger);
    document.getElementById('closingIcon').textContent = danger ? '⚠️' : '⏱';
    const timeLabel = minutesLeft >= 60
      ? Math.floor(minutesLeft/60) + 'h' + String(minutesLeft%60).padStart(2,'0') + ' restantes'
      : minutesLeft + ' min restantes';
    document.getElementById('closingText').innerHTML =
      (danger ? 'Dernier appel — ' : 'Fermeture à 2h — ') +
      '<span style="color:' + (danger ? 'var(--red)' : 'var(--teal)') + ';font-weight:700;">' + timeLabel + '</span>';
  } else {
    const next18 = new Date(now);
    next18.setHours(18, 0, 0, 0);
    const minutesLeft = Math.floor((next18 - now) / 60000);
    const timeLabel = minutesLeft >= 60
      ? Math.floor(minutesLeft/60) + 'h' + String(minutesLeft%60).padStart(2,'0')
      : minutesLeft + ' min';
    banner.classList.remove('danger');
    document.getElementById('closingIcon').textContent = '🔒';
    document.getElementById('closingText').innerHTML =
      'Fermé — ouverture à 18h — <span style="color:var(--muted);font-weight:700;">' + timeLabel + '</span>';
  }
}

// Lightweight per-second tick: updates only the clock, the closing
// countdown, and the live timer text inside existing cards — never
// touches innerHTML of a list or the add-row, so it can never steal
// focus from an input the user is typing into.
function tickClock() {
  const now = new Date();
  const nowMs = now.getTime();
  const openNow = isOpenNow(now);
  updateClosingBanner(now, openNow);
  state.clients.forEach(c => {
    const liveEl = document.getElementById('live-' + c.id);
    if (liveEl) liveEl.textContent = fmtDuration(clientTotalSeconds(c, nowMs));
    const totalEl = document.getElementById('total-' + c.id);
    if (totalEl) totalEl.textContent = fmtDuration(clientTotalSeconds(c, nowMs));
  });
}

function render() {
  const now = new Date();
  const nowMs = now.getTime();
  const openNow = isOpenNow(now);

  updateClosingBanner(now, openNow);

  // Add-zone: only usable during opening hours (18h–2h).
  // We toggle visibility only — never recreate the input — so typing
  // isn't interrupted by a re-render.
  document.getElementById('addRow').style.display = openNow ? 'flex' : 'none';
  document.getElementById('closedNote').style.display = openNow ? 'none' : 'block';

  // Active list
  const active = state.clients.filter(c => c.active);
  const activeSection = document.getElementById('activeSection');
  activeSection.style.display = active.length ? 'block' : 'none';
  document.getElementById('activeList').innerHTML = active.map(c => `
    <div class="card">
      <div class="left">
        <span class="dot"></span>
        <span class="name">${escapeHtml(c.name)}</span>
        <span class="time-live" id="live-${c.id}">${fmtDuration(clientTotalSeconds(c, nowMs))}</span>
      </div>
      <button class="icon-btn" onclick="punchOut('${c.id}')" title="Arrêter le chrono">⏻</button>
    </div>
  `).join('');

  // Leaderboard
  const ranked = getRanked(nowMs);
  const lb = document.getElementById('leaderboard');
  if (ranked.length === 0) {
    lb.innerHTML = '<p class="empty">Personne n\'a encore lancé son chrono. Ajoute ton premier participant ci-dessus.</p>';
  } else {
    lb.innerHTML = ranked.map((c, i) => {
      const medalClass = i === 0 ? 'gold' : i === 1 ? 'silver' : i === 2 ? 'bronze' : '';

      if (editingId === c.id) {
        const total = clientTotalSeconds(c, nowMs);
        const curH = Math.floor(total / 3600);
        const curM = Math.floor((total % 3600) / 60);
        return `
          <div class="card edit-row">
            <div class="left">
              <span class="rank-num ${medalClass}">${i+1}</span>
              <span class="name">${escapeHtml(c.name)}</span>
            </div>
            <div class="edit-fields">
              <input type="number" min="0" id="editH-${c.id}" value="${curH}" class="edit-input"> <span class="edit-unit">h</span>
              <input type="number" min="0" max="59" id="editM-${c.id}" value="${curM}" class="edit-input"> <span class="edit-unit">min</span>
            </div>
            <div class="edit-actions">
              <button class="small-link" onclick="saveEdit('${c.id}')">Enregistrer</button>
              <button class="icon-btn" onclick="cancelEdit()">✕</button>
            </div>
          </div>
        `;
      }

      if (deletingId === c.id) {
        return `
          <div class="card delete-row">
            <span class="delete-text">Supprimer ${escapeHtml(c.name)} et son historique ?</span>
            <div class="edit-actions">
              <button class="small-link danger" onclick="confirmDelete('${c.id}')">Confirmer</button>
              <button class="icon-btn" onclick="cancelDelete()">Annuler</button>
            </div>
          </div>
        `;
      }

      return `
        <div class="card ${i === 0 ? 'rank-1' : ''}">
          <div class="left">
            <span class="rank-num ${medalClass}">${i+1}</span>
            <span class="name">${escapeHtml(c.name)}</span>
            ${i === 0 ? '<span>👑</span>' : ''}
          </div>
          <div class="left">
            <span class="time-total" id="total-${c.id}">${fmtDuration(clientTotalSeconds(c, nowMs))}</span>
            <button class="icon-btn" onclick="requireAdmin(function(){ startEdit('${c.id}') })" title="Corriger le temps">✎</button>
            ${!c.active && openNow ? `<button class="small-link" onclick="punchIn('${c.id}')">relancer</button>` : ''}
            <button class="icon-btn" onclick="requireAdmin(function(){ askDelete('${c.id}') })" title="Supprimer">✕</button>
          </div>
        </div>
      `;
    }).join('');
  }

  // Winners
  const winnersSection = document.getElementById('winnersSection');
  winnersSection.style.display = state.winners.length ? 'block' : 'none';
  document.getElementById('winnersList').innerHTML = state.winners.map(w => `
    <div class="card winner-row">
      <div class="left">🏆 <span>${escapeHtml(w.name)}</span></div>
      <span class="right">${fmtDuration(w.total)} · ${w.date}</span>
    </div>
  `).join('');

  // End-challenge button state
  document.getElementById('endChallengeBtn').disabled = ranked.length === 0;

  // Confirm zone
  const zone = document.getElementById('confirmZone');
  if (confirmingEnd && ranked.length > 0) {
    const champ = ranked[0];
    zone.innerHTML = `
      <div class="confirm-box">
        <p>⚠️ <span>${escapeHtml(champ.name)} remporte le challenge avec ${fmtDuration(clientTotalSeconds(champ, nowMs))}. Le classement sera archivé et remis à zéro. Confirmer ?</span></p>
        <div class="confirm-actions">
          <button class="btn-confirm" onclick="declareWinner()">Confirmer</button>
          <button class="btn-cancel" onclick="cancelEnd()">Annuler</button>
        </div>
      </div>
    `;
    document.getElementById('endChallengeBtn').style.display = 'none';
  } else {
    zone.innerHTML = '';
    document.getElementById('endChallengeBtn').style.display = 'block';
  }
}

function cancelEnd() {
  confirmingEnd = false;
  render();
}

document.getElementById('closeNightBtn').addEventListener('click', () => requireAdmin(closeNightNow));
document.getElementById('endChallengeBtn').addEventListener('click', () => requireAdmin(() => { confirmingEnd = true; render(); }));
document.getElementById('adminCodeInput').addEventListener('keydown', e => { if (e.key === 'Enter') submitAdminCode(); });
document.getElementById('addBtn').addEventListener('click', addClient);
document.getElementById('nameInput').addEventListener('keydown', e => { if (e.key === 'Enter') addClient(); });

enforceClosing();
render();
setInterval(() => { if (enforceClosing()) render(); else tickClock(); }, 1000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) { enforceClosing(); render(); } });
window.addEventListener('focus', () => { enforceClosing(); render(); });
</script>
</body>
</html>
